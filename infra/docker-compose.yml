services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: command_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d command_center"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["..:/app"]
    ports: ["8000:8000"]
    env_file: ../.env.example
    depends_on:
      db: {condition: service_healthy}
  web:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes: ["../apps/web:/app"]
    ports: ["3000:3000"]