[project]
name = "personal-command-center-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.0,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["packages/core/tests", "tests/evals"]